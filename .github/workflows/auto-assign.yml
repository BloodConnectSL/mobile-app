# Date: 2026-08-01
# Added: Auto-assign Pull Requests (Fixed permissions and config)
name: Auto Assign
on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write
  issues: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - uses: kentaro-m/auto-assign-action@v2.0.2
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
